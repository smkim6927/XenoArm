[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xenoarm"
version = "0.1.0"
description = "Paired language-correction experiments for Light-WAM, LIBERO and RoboTwin 2.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4", "mujoco==3.3.2", "PyYAML==6.0.3",
  "tqdm>=4.66,<5", "wandb>=0.22,<1", "Pillow>=11,<13",
  "imageio>=2.37,<3", "imageio-ffmpeg==0.6.0", "matplotlib>=3.8,<3.11",
]

[project.optional-dependencies]
libero = [
  "torch==2.7.1+cpu", "robosuite==1.4.0", "bddl==1.0.1", "easydict==1.13",
  "gym==0.25.2", "opencv-python==4.11.0.86", "matplotlib>=3.8,<3.11",
  "cloudpickle>=3,<4", "future==1.0.0", "termcolor>=2,<4",
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "torch-cpu" }

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
xenoarm = "xenoarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xenoarm = ["assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
