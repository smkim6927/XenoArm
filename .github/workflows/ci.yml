name: CPU validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src scripts tests
      - run: uv run --frozen pytest -q
      - run: uv build
      - run: uv run --frozen xenoarm run --config configs/smoke.json --output results/ci-smoke
